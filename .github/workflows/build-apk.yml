name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release LinkUp Messenger APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Project Dependencies
        run: |
          npm install

      - name: Install Capacitor Tooling
        run: |
          npm install -D @capacitor/cli @capacitor/core @capacitor/android

      - name: Build Web Application
        run: |
          npm run build

      - name: Initialize & Sync Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK File for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk LinkUp-Messenger.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinkUp-Messenger-APK
          path: LinkUp-Messenger.apk
          retention-days: 30

      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            TAG="${{ github.event.inputs.version_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: LinkUp Messenger ${{ steps.vars.outputs.tag }}
          body: |
            ### 📱 LinkUp Messenger Android APK Release

            Download the direct `.apk` file below and install it directly on your Android device.

            - **Version**: `${{ steps.vars.outputs.tag }}`
            - **Commit**: `${{ github.sha }}`
            - **Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

            #### What's Included:
            - Full real-time messaging with Firebase Firestore
            - Unique User ID search & friend system
            - Sent, Delivered, and Seen message receipts
            - Light & Dark mode support
          files: LinkUp-Messenger.apk
          draft: false
          prerelease: false
